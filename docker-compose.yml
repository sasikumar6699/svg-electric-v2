version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: svg_electric_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: svg_electric_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svg_electric_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/svg_electric_db?schema=public"
      SESSION_SECRET: "svg-electric-estimation-secure-session-key-32chars-min!"
      ADMIN_EMAIL: "admin@svgelectric.com"
      ADMIN_PASSWORD: "Admin@12345"
      SALES_EMAIL: "sales@svgelectric.com"
      SALES_PASSWORD: "Sales@12345"
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data: